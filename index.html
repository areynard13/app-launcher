<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <div class="grid" id="grid"></div>
  </main>

  <script src="data.js"></script>
  <script>
    document.title = SITE.title;
    document.getElementById("title").textContent = SITE.title;

    const grid = document.getElementById("grid");

    SITE.apps.forEach(app => {
      const domain = new URL(app.url).hostname;
      const link = document.createElement("a");
      link.className = "tile";
      link.href = app.url;

      const img = document.createElement("img");
      img.alt = "";
      img.width = img.height = 64;
      // Use iconURL from data.js; fall back to the site's favicon
      img.src = app.iconURL || "https://www.google.com/s2/favicons?domain=" + domain + "&sz=128";
      // If the icon can't be loaded, show the first letter of the name
      img.onerror = () => {
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = app.name.charAt(0).toUpperCase();
        img.replaceWith(letter);
      };

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = app.name;

      link.append(img, name);
      grid.appendChild(link);
    });
  </script>
</body>
</html>
